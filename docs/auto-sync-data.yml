name: Auto-Sync Production Data (24/7)

on:
  schedule:
    # Tự động đồng bộ mỗi 15 phút (theo giờ hệ thống UTC, script chạy theo múi giờ Asia/Ho_Chi_Minh UTC+7)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-production-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Google Sheets Data
        run: python3 sync_service.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/datamass-data.js \
            js/inventory-1c-data.js \
            js/mass-history-data.js \
            js/hardtest-capacity-data.js \
            js/assembly-capacity-data.js \
            js/clips-alls-data.js \
            js/bom-data.js \
            js/kpi-data.js \
            manpower_data.json \
            inventory_1c_data.json \
            mass_history_data.json \
            hardtest_data.json \
            clips_alls_data.json \
            clips_alls_history.json \
            bom_data.json \
            kpi_data.json \
            sync_status.json

          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          NOW_VN=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Auto-sync (GitHub 24/7): Cập nhật dữ liệu sản xuất [${NOW_VN}]"

          # Thử push; nếu có commit mới vừa được đẩy từ máy khác, tự fetch & rebase an toàn rồi đẩy lại
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase FETCH_HEAD || (git checkout --theirs -- js/*-data.js *_data.json clips_alls_history.json sync_status.json && git add js/*-data.js *_data.json clips_alls_history.json sync_status.json && git -c core.editor=true rebase --continue)
            git push origin HEAD:main
          fi
